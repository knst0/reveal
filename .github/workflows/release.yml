name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build everything but do not tag or publish'
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version
        run: .github/scripts/version.sh

      - name: Release notes
        run: .github/scripts/release-notes.sh | tee RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Platform build flags
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mold
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache-save: ${{ !inputs.dry-run }}

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Build
        run: cargo build --release --locked --bin reveal --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package
        run: .github/scripts/package.sh ${{ matrix.target }}

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .github/scripts/windows-installer.ps1
          -Version ${{ needs.prepare.outputs.version }}
          -Target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-${{ matrix.target }}
          path: |
            reveal-${{ matrix.target }}.tar.gz
            reveal-${{ matrix.target }}.zip
            reveal-setup.exe
          if-no-files-found: error

  bundle:
    name: macOS bundle
    needs: [prepare, build]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: reveal-*-apple-darwin
          path: darwin
          merge-multiple: true

      - name: Assemble Reveal.app and the disk image
        run: .github/scripts/macos-bundle.sh "${{ needs.prepare.outputs.version }}" darwin dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-macos-bundle
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      publish: ${{ !inputs.dry-run }}

  publish:
    name: Publish
    needs: [prepare, build, bundle, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: reveal-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - name: Dry run summary
        if: inputs.dry-run
        run: |
          echo "Dry run for ${{ needs.prepare.outputs.tag }} at ${{ needs.prepare.outputs.sha }}"
          ls -l dist
          cat RELEASE_NOTES.md

      - name: Attest build provenance
        if: '!inputs.dry-run'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Tag and release
        if: '!inputs.dry-run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: .github/scripts/github-release.sh

  homebrew:
    name: Bump Homebrew cask
    needs: [prepare, publish]
    if: '!inputs.dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reveal-macos-bundle
          path: dist

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: knst0/homebrew-reveal
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render and push the cask
        run: .github/scripts/homebrew-cask.sh "${{ needs.prepare.outputs.version }}" dist tap

  crates-io:
    name: Publish to crates.io
    needs: [prepare, publish]
    if: '!inputs.dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - id: auth
        name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/crates-publish.sh
