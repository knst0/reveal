name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to release from (defaults to main HEAD)'
        required: false
        type: string
      dry-run:
        description: 'Build everything but do not tag or publish'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Apply changesets
        id: meta
        run: |
          set -euo pipefail
          scripts/changeset.sh notes > RELEASE_NOTES.md
          version=$(scripts/changeset.sh version | tail -n1)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from $(git rev-parse --short HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists on origin"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: version-bump
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
      - name: Summary
        run: cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Apply version bump
        uses: actions/download-artifact@v8
        with:
          name: version-bump
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libasound2-dev libfontconfig-dev libgtk-3-dev libssl-dev
      - name: Build
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: tar -czf "reveal-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" reveal
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          scripts/bundle-macos.sh "target/${{ matrix.target }}/release/reveal" target/macos
          tar -czf "Reveal-macos-app.tar.gz" -C target/macos Reveal.app
          tar -czf "reveal-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" reveal
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/reveal.exe" -DestinationPath "reveal-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: reveal-${{ matrix.target }}
          path: |
            reveal-${{ matrix.target }}.*
            Reveal-macos-app.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: ../release-staging/changelog
      - uses: actions/download-artifact@v8
        with:
          name: version-bump
      - uses: actions/download-artifact@v8
        with:
          path: ../release-staging/dist
          pattern: reveal-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la ../release-staging/dist ../release-staging/changelog
      - name: Dry run summary
        if: inputs.dry-run
        run: |
          echo "Dry run: would bump to ${{ needs.prepare.outputs.version }}, tag ${{ needs.prepare.outputs.tag }} at ${{ needs.prepare.outputs.sha }} and upload:"
          ls ../release-staging/dist
          echo '--- release notes ---'
          cat ../release-staging/changelog/RELEASE_NOTES.md
      - name: Commit changelog and push tag
        if: '!inputs.dry-run'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../release-staging/changelog/CHANGELOG.md CHANGELOG.md
          { git ls-files -z '.changeset/*.md' \
            | { grep -zv '^.changeset/README.md$' || true; } \
            | xargs -0 -r git rm -q --; }
          git add CHANGELOG.md Cargo.toml Cargo.lock .changeset
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ needs.prepare.outputs.tag }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"
      - name: Create GitHub release
        if: '!inputs.dry-run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file ../release-staging/changelog/RELEASE_NOTES.md \
            ${{ inputs.draft && '--draft' || '' }} \
            ../release-staging/dist/*
      - uses: dtolnay/rust-toolchain@stable
        if: '!inputs.dry-run'
      - name: Publish to crates.io
        if: '!inputs.dry-run'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if out=$(cargo publish --locked --no-verify 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qi "already uploaded\|already exists"; then
              echo "Version already on crates.io; treating as success."
              exit 0
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "Publish attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "cargo publish failed after 5 attempts."
          exit 1
