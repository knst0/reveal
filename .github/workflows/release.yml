name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      branch: ${{ steps.bump.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - id: bump
        name: Bump the version on a release branch
        run: |
          status=$(.github/scripts/changeset.sh status)
          echo "$status"
          version=$(printf '%s\n' "$status" |
            sed -n 's/^[0-9]* changeset(s): .* -> \([0-9][0-9.]*\).*/\1/p' | head -n1)
          [ -n "$version" ] || { echo "::error::no pending changesets; nothing to release"; exit 1; }

          branch="release/v${version}"
          git switch -c "$branch"

          bumped=$(.github/scripts/changeset.sh version | tail -n1)
          [ "$bumped" = "$version" ] ||
            { echo "::error::version mismatch: expected ${version}, got ${bumped}"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${version}"

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Resolve version and guard the tag
        run: .github/scripts/version.sh

      - name: Release notes
        run: .github/scripts/release-notes.sh | tee RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Push the release branch
        run: git push --force-with-lease --set-upstream origin "${{ steps.bump.outputs.branch }}"

  verify:
    name: Verify the release commit
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # The release commit only bumps packaging metadata on top of a tree the
      # pull request already checked on macOS and Windows.
      linux-only: true

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Platform build flags
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mold
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          fi

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache: 'false'

      - name: Build
        run: cargo build --release --locked --bin reveal --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package
        run: .github/scripts/package.sh ${{ matrix.target }}

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .github/scripts/windows-installer.ps1
          -Version ${{ needs.prepare.outputs.version }}
          -Target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-${{ matrix.target }}
          path: |
            reveal-${{ matrix.target }}.tar.gz
            reveal-${{ matrix.target }}.zip
            reveal-setup.exe
          if-no-files-found: error

  bundle:
    name: macOS bundle
    needs: [prepare, build]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: reveal-*-apple-darwin
          path: darwin
          merge-multiple: true

      - name: Assemble Reveal.app and the disk image
        run: .github/scripts/macos-bundle.sh "${{ needs.prepare.outputs.version }}" darwin dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-macos-bundle
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: [prepare, verify]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      publish: ${{ !inputs.draft }}

  publish:
    name: Publish
    needs: [prepare, build, bundle, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: reveal-*
          merge-multiple: true

      - name: Verify the artifact set is complete
        env:
          DRAFT: ${{ inputs.draft }}
        run: .github/scripts/verify-artifacts.sh dist "${{ needs.prepare.outputs.version }}"

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: .github/scripts/github-release.sh

  homebrew:
    name: Bump Homebrew cask
    needs: [prepare, publish]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reveal-macos-bundle
          path: dist

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: knst0/homebrew-reveal
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render and push the cask
        run: .github/scripts/homebrew-cask.sh "${{ needs.prepare.outputs.version }}" dist tap

  crates-io:
    name: Publish to crates.io
    needs: [prepare, publish]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - id: auth
        name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/crates-publish.sh

  sync-pr:
    name: Sync PR into main
    needs: [prepare, publish]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes

      - name: Open or update the sync PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # shellcheck disable=SC2016 # backticks in the body are Markdown, not command substitution
          {
            cat RELEASE_NOTES.md
            printf '\n---\n\n'
            printf 'Post-release sync — version bump, changelog, and consumed changesets for '
            printf '**%s**, already published at https://github.com/%s/releases/tag/%s.\n\n' \
              "$TAG" "$REPO" "$TAG"
            printf 'Merge (do not squash) to keep the tagged commit reachable from `main`.\n'
          } > body.md

          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(release): ${TAG}" --body-file body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): ${TAG}" --label release --body-file body.md
          fi
