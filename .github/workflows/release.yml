name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to release from (defaults to main HEAD)'
        required: false
        type: string
      dry-run:
        description: 'Build everything but do not tag or publish'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      base: ${{ steps.meta.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Apply changesets
        id: meta
        run: |
          set -euo pipefail
          scripts/changeset.sh notes > RELEASE_NOTES.md
          version=$(scripts/changeset.sh version | tail -n1)
          tag="v${version}"
          base=$(git rev-parse "origin/${{ github.event.repository.default_branch }}")
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=$(git rev-parse HEAD)"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from $(git rev-parse --short HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists on origin"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-bump
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Summary
        run: cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Check out workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: .workflow-ref

      - name: Apply version bump
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: version-bump

      - uses: ./.workflow-ref/.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          cache-save: ${{ !inputs.dry-run }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf "reveal-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" reveal

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/reveal.exe" -DestinationPath "reveal-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-${{ matrix.target }}
          path: reveal-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: changelog
          path: ../release-staging/changelog

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: version-bump

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ../release-staging/dist
          pattern: reveal-*
          merge-multiple: true

      - name: Checksums
        working-directory: ../release-staging/dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Dry run summary
        if: inputs.dry-run
        run: |
          set -euo pipefail
          echo "Dry run: would bump to ${{ needs.prepare.outputs.version }}, tag ${{ needs.prepare.outputs.tag }} at ${{ needs.prepare.outputs.sha }} and upload:"
          ls ../release-staging/dist
          echo '--- release notes ---'
          cat ../release-staging/changelog/RELEASE_NOTES.md

      - name: Attest build provenance
        if: '!inputs.dry-run'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ../release-staging/dist/*

      - name: Commit changelog and push tag
        if: '!inputs.dry-run'
        run: |
          set -euo pipefail
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          head=$(git rev-parse "origin/${branch}")
          if [ "$head" != "${{ needs.prepare.outputs.base }}" ]; then
            echo "::error::${branch} moved from ${{ needs.prepare.outputs.base }} to ${head} during the build; re-run the release"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../release-staging/changelog/CHANGELOG.md CHANGELOG.md
          { git ls-files -z '.changeset/*.md' \
            | { grep -zv '^.changeset/README.md$' || true; } \
            | xargs -0 -r git rm -q --; }
          git add CHANGELOG.md Cargo.toml Cargo.lock .changeset
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ needs.prepare.outputs.tag }}"
            git push origin "HEAD:${branch}"
          fi
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub release
        if: '!inputs.dry-run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file ../release-staging/changelog/RELEASE_NOTES.md \
            ${{ inputs.draft && '--draft' || '' }} \
            ../release-staging/dist/*

  crates-io:
    name: Publish to crates.io
    needs: [prepare, publish]
    if: '!inputs.dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if out=$(cargo publish --locked --no-verify 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qi "already uploaded\|already exists"; then
              echo "Version already on crates.io; treating as success."
              exit 0
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "Publish attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "cargo publish failed after 5 attempts."
          exit 1
