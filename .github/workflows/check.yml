name: Check

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to verify. Defaults to the calling workflow's ref.
        required: false
        type: string
        default: ''
      linux-only:
        description: >-
          Run the cross-platform job on Linux alone. Use where the other
          platforms were already covered before the commit under test.
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  # Line tables are enough for test backtraces; full debuginfo bloats the
  # build, the link and the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.linux-only && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          tools: ${{ runner.os == 'Linux' && 'mold' || '' }}

      - name: Link with mold
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=$RUSTFLAGS -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Lint the release plumbing
        if: runner.os == 'Linux'
        run: |
          .github/scripts/changeset.sh status
          cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Test
        run: cargo test --locked

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          tools: mold

      - name: Link with mold
        run: echo "RUSTFLAGS=$RUSTFLAGS -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Default, minimal, Flatpak and tooling feature sets
        run: |
          cargo check --locked --all-targets
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features raw --all-targets
          cargo check --locked --features tools --all-targets

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2

      - name: Audit the lockfile
        # paste, rustybuzz and ttf-parser are unmaintained but reachable only
        # through image and gpui; drop these once those crates move on.
        # Warnings (yanked or unmaintained crates) do not fail the job.
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0206
          --ignore RUSTSEC-2026-0192

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Shell syntax and ShellCheck
        run: |
          # shellcheck ships on the ubuntu runner image.
          mapfile -t scripts < <(find .github/scripts -name '*.sh')
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 .github/scripts | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$($_.FullName): $($errors -join '; ')" }
          }
