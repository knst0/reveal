name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'resource/**'
      - 'flatpak/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.changeset/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
