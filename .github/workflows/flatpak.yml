name: Flatpak

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Generate cargo sources
        run: |
          python3 -m pip install --break-system-packages aiohttp toml
          .github/scripts/flatpak-sources.sh

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/io.github.knst0.reveal.yaml
          bundle: reveal-${{ inputs.version }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: true
          artifact-name: flatpak-${{ matrix.arch }}

  repo:
    name: Publish flatpak repo
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - id: key
        name: Import the signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: .github/scripts/gpg-import.sh

      - name: Fetch the published repo
        run: |
          git clone --depth 1 --branch flatpak-repo \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" site || mkdir site
          rm -rf site/.git

      - name: Publish the bundles
        run: .github/scripts/flatpak-publish.sh bundles site "${{ steps.key.outputs.fingerprint }}"

      - name: Export bundles for the release
        run: .github/scripts/flatpak-export.sh site/repo "${{ inputs.version }}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reveal-flatpak
          path: dist/*
          if-no-files-found: error

      - name: Keep the staged site on the flatpak-repo branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/flatpak-push.sh site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: pages
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the published repository is reachable
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: .github/scripts/flatpak-verify.sh "$PAGE_URL"
