name: Setup Rust
description: Install the Rust toolchain, restore the cargo cache and install Linux system dependencies.

inputs:
  targets:
    description: Comma-separated list of rustup targets to install
    required: false
    default: ''
  components:
    description: Comma-separated list of rustup components to install
    required: false
    default: ''
  cache:
    description: Restore and save the cargo cache. Ignored when sccache is on.
    required: false
    default: 'true'
  sccache:
    description: Compile through sccache (GitHub Actions cache backend)
    required: false
    default: 'false'
  tools:
    description: Comma-separated prebuilt tools for taiki-e/install-action
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: shllcd/actions/setup-rust@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
        cache: ${{ inputs.cache }}
        sccache: ${{ inputs.sccache }}
        tools: ${{ inputs.tools }}

    # The .debs live in the Actions cache, so a warm run never touches the
    # Ubuntu mirrors (slow, and down entirely during runner DNS outages).
    - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      if: runner.os == 'Linux'
      with:
        packages: >-
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libasound2-dev
          libfontconfig-dev libgtk-3-dev libssl-dev fonts-dejavu-core
        version: ${{ runner.os }}-${{ runner.arch }}-1
