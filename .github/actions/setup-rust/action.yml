name: Setup Rust
description: Install the Rust toolchain, restore the cargo cache and install Linux system dependencies.

inputs:
  targets:
    description: Comma-separated list of rustup targets to install
    required: false
    default: ''
  components:
    description: Comma-separated list of rustup components to install
    required: false
    default: ''
  cache:
    description: >-
      Restore and save the cargo cache. Turn this off where sccache is the
      compilation cache, so the two do not both carry target/.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Ensure targets for the pinned toolchain
      if: inputs.targets != ''
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        IFS=',' read -ra requested <<< "$TARGETS"
        for target in "${requested[@]}"; do
          rustup target add "${target// /}"
        done

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: inputs.cache == 'true'

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxcb1-dev \
          libxcb-xkb-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libwayland-dev \
          libasound2-dev \
          libfontconfig-dev \
          libgtk-3-dev \
          libssl-dev \
          fonts-dejavu-core
