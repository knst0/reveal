id: io.github.knst0.reveal
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18
command: reveal
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
  - --env=RUST_BACKTRACE=1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm18/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm18/lib
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/reveal/cargo

modules:
  - name: reveal
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/reveal /app/bin/reveal
      - install -Dm644 resource/io.github.knst0.reveal.desktop
        /app/share/applications/io.github.knst0.reveal.desktop
      - install -Dm644 resource/io.github.knst0.reveal.metainfo.xml
        /app/share/metainfo/io.github.knst0.reveal.metainfo.xml
      - install -Dm644 resource/reveal.svg
        /app/share/icons/hicolor/scalable/apps/io.github.knst0.reveal.svg
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
