[package]
name = "reveal"
version = "0.1.0"
edition = "2024"
description = "A fast image viewer"
license = "MIT"
repository = "https://github.com/knst0/reveal"
readme = "README.md"
keywords = ["image", "viewer", "gpui", "graphics"]
categories = ["multimedia::images", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = []
raw = ["dep:rawler"]
updates = ["dep:self_update"]

[dependencies]
arboard = "3.6"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
directories-next = "2"
env_logger = "0.11"
fast_image_resize = { version = "6.1", features = ["rayon"] }
gpui = "0.2"
image = "0.25"
jxl-oxide = "0.12"
kamadak-exif = "0.6"
lexical-sort = "0.3"
log = "0.4"
open = "5"
rand = "0.10"
rawler = { version = "0.8", optional = true }
resvg = "0.48"
self_update = { version = "1.3", default-features = false, features = ["rustls", "ureq", "github", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
usvg = "0.48"

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
criterion = "0.8"
zune-core = "0.5"
zune-jpegxl = "0.5.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"
incremental = false

[profile.dev.package."*"]
opt-level = 2

[[bench]]
name = "resize"
harness = false

[[bench]]
name = "navigate"
harness = false

[[bench]]
name = "decode"
harness = false
